name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm init -y && npm install

      - name: Instalar Capacitor Android
        run: npm install @capacitor/android

      - name: Criar projeto Android
  run: npx --yes @capacitor/cli add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar AAB
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease

      - name: Enviar AAB
        uses: actions/upload-artifact@v4
        with:
          name: Oficina-Facil-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b7cff"><link rel="manifest" href="manifest.json"><title>Oficina Fácil + Mecânico Perto</title>
<style>
:root{--blue:#087cff;--orange:#ff7417;--dark:#0c1624;--bg:#f4f7fb;--card:#fff;--muted:#667085;--line:#e5eaf1;--ok:#12a56b;--danger:#d92d20}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:#101828}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.top{position:sticky;top:0;z-index:20;background:var(--dark);color:white;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:20px}.brand b{color:#43a4ff}.pill{padding:7px 11px;border-radius:99px;background:#1d2b3e;color:#dce9f8;font-size:12px}.shell{max-width:1180px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tab{background:white;border:1px solid var(--line);padding:10px 14px;border-radius:12px;white-space:nowrap}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 3px 14px #1018280a}.stat b{display:block;font-size:25px;margin-top:5px}.muted{color:var(--muted);font-size:13px}.section{margin:18px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 13px;border-radius:10px;background:var(--blue);color:#fff;font-weight:700}.btn.secondary{background:#edf5ff;color:#075bc0}.btn.orange{background:var(--orange)}.btn.ghost{background:white;color:#344054;border:1px solid var(--line)}.btn.danger{background:#fee4e2;color:#b42318}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form .full{grid-column:1/-1}label{font-size:12px;font-weight:700;color:#344054;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;background:#fff}textarea{min-height:90px}.tag{font-size:11px;padding:5px 8px;border-radius:99px;background:#eef4ff;color:#175cd3}.tag.ok{background:#e7f8f0;color:#087443}.tag.warn{background:#fff3e8;color:#b54708}.tag.bad{background:#fee4e2;color:#b42318}.hero{background:linear-gradient(120deg,#071b33,#0d4f9e);color:#fff;border-radius:20px;padding:22px;margin-bottom:16px}.hero h1{margin:0 0 7px}.hero p{margin:0;color:#d6e7ff}.map{height:260px;border-radius:15px;background:linear-gradient(135deg,#dcefff,#eef8f2);position:relative;overflow:hidden}.pin{position:absolute;background:var(--orange);color:#fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);width:30px;height:30px;display:grid;place-items:center}.pin span{transform:rotate(45deg)}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.show{display:flex}.modalbox{background:white;border-radius:18px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:20px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:11px 15px;border-radius:10px;display:none;z-index:60}.toast.show{display:block}.hide{display:none!important}.small{font-size:12px}.stars{color:#f79009;letter-spacing:2px}.price{font-size:25px;font-weight:800}.footer{padding:30px 0;color:var(--muted);font-size:12px;text-align:center}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.shell{padding:12px}.top{padding:12px}.hero{padding:18px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}}
</style></head>
<body>
<header class="top"><div class="brand">🔧 Oficina <b>Fácil</b> <span style="opacity:.5">+</span> <span style="color:#ff8b3d">Mecânico Perto</span></div><div class="actions"><span id="rolePill" class="pill">Visitante</span><button class="btn ghost" onclick="openLogin()">Entrar / Cadastrar</button></div></header>
<main class="shell"><div id="app"></div><div class="footer">MVP comercial • Dados locais para demonstração • Integrações reais exigem configuração de servidor, mapas, pagamentos e contas de publicação.</div></main>
<div id="modal" class="modal"><div class="modalbox" id="modalBox"></div></div><div id="toast" class="toast"></div>
<script>
const K='oficinaFacilV3';let db=JSON.parse(localStorage.getItem(K)||'null')||{user:null,customers:[],vehicles:[],quotes:[],orders:[],appointments:[],shops:[{id:'s1',name:'Oficina Modelo',city:'Joinville - SC',phone:'47999990000',services:['Revisão','Freios','Suspensão'],rating:4.8,lat:-26.30,lng:-48.84}],reviews:[],notifications:[],plans:'free'};function save(){localStorage.setItem(K,JSON.stringify(db))}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)}function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function openLogin(){openModal(`<h2>Entrar ou criar conta</h2><p class="muted">Escolha como você vai usar o sistema.</p><div class="grid"><button class="btn" onclick="login('oficina')">🔧 Sou oficina/mecânico</button><button class="btn orange" onclick="login('cliente')">🚗 Sou motorista</button></div><hr><p class="small muted">Nesta versão de teste a conta é salva somente neste aparelho.</p>`)}
function login(role){db.user={name:role==='oficina'?'Oficina Modelo':'Cliente Demo',role};save();closeModal();render();toast('Conta criada com sucesso')}function logout(){db.user=null;save();render()}
function nav(items,active){return `<div class="tabs">${items.map(x=>`<button class="tab ${x[0]===active?'active':''}" onclick="route('${x[0]}')">${x[1]}</button>`).join('')}</div>`}
function route(r){render(r)}
function render(routeName){let role=db.user?.role||'visitante';document.getElementById('rolePill').textContent=db.user?`${db.user.name} • ${role==='oficina'?'Oficina':'Cliente'}`:'Visitante';let r=routeName||((role==='oficina')?'dashboard':'home');let html='';if(role==='oficina')html=renderShop(r);else html=renderClient(r);document.getElementById('app').innerHTML=html}
function renderShop(r){let tabs=[['dashboard','📊 Painel'],['clientes','👥 Clientes'],['veiculos','🚗 Veículos'],['orcamentos','🧾 Orçamentos'],['ordens','🔧 Serviços'],['agenda','📅 Agenda'],['financeiro','💰 Financeiro'],['plano','⭐ Plano'],['config','⚙️ Config']];if(r==='dashboard')return `<div class="hero"><h1>Oficina Fácil</h1><p>Controle sua oficina, organize serviços e aumente seus resultados.</p></div>${nav(tabs,r)}<div class="grid"><div class="card stat"><span class="muted">Clientes</span><b>${db.customers.length}</b></div><div class="card stat"><span class="muted">Veículos</span><b>${db.vehicles.length}</b></div><div class="card stat"><span class="muted">Orçamentos</span><b>${db.quotes.length}</b></div><div class="card stat"><span class="muted">Serviços</span><b>${db.orders.length}</b></div></div><div class="section grid"><div class="card"><h3>Ações rápidas</h3><div class="actions"><button class="btn" onclick="newCustomer()">+ Cliente</button><button class="btn secondary" onclick="newVehicle()">+ Veículo</button><button class="btn secondary" onclick="newQuote()">+ Orçamento</button><button class="btn secondary" onclick="newOrder()">+ Ordem</button></div></div><div class="card"><h3>Resumo financeiro</h3><div class="row"><span>Faturamento</span><b>${money(db.orders.reduce((a,o)=>a+Number(o.total||0),0))}</b></div><div class="row"><span>Orçamentos abertos</span><b>${db.quotes.filter(q=>q.status==='Pendente').length}</b></div></div></div>`;
if(r==='clientes')return page(tabs,r,'Clientes',db.customers.map(c=>`<div class="card row"><div><b>${esc(c.name)}</b><div class="muted">${esc(c.phone||'Sem telefone')} • ${esc(c.email||'')}</div></div><button class="btn ghost" onclick="newVehicle('${c.id}')">+ Veículo</button></div>`).join(''),()=>newCustomer());
if(r==='veiculos')return page(tabs,r,'Veículos',db.vehicles.map(v=>{let c=db.customers.find(x=>x.id===v.customerId);return `<div class="card row"><div><b>${esc(v.plate)} — ${esc(v.brand)} ${esc(v.model)}</b><div class="muted">${esc(c?.name||'Cliente')} • ${esc(v.year)} • ${esc(v.km)} km</div></div><button class="btn ghost" onclick="newQuote('${v.id}')">Orçar</button></div>`}).join(''),()=>newVehicle());
if(r==='orcamentos')return page(tabs,r,'Orçamentos',db.quotes.map(q=>`<div class="card"><div class="row"><div><b>${esc(q.title)}</b><div class="muted">${esc(q.vehicle)} • ${new Date(q.date).toLocaleDateString('pt-BR')}</div></div><span class="tag ${q.status==='Aprovado'?'ok':''}">${q.status}</span></div><h3>${money(q.total)}</h3><div class="actions"><button class="btn secondary" onclick="sendWA('${q.phone}','Olá! Segue seu orçamento: ${money(q.total)}')">WhatsApp</button><button class="btn ghost" onclick="approveQuote('${q.id}')">Aprovar</button></div></div>`).join(''),()=>newQuote());
if(r==='ordens')return page(tabs,r,'Ordens de serviço',db.orders.map(o=>`<div class="card row"><div><b>${esc(o.title)}</b><div class="muted">${esc(o.vehicle)} • ${esc(o.status)}</div></div><b>${money(o.total)}</b></div>`).join(''),()=>newOrder());
if(r==='agenda')return page(tabs,r,'Agenda',db.appointments.map(a=>`<div class="card"><div class="row"><b>${esc(a.date)} ${esc(a.time)}</b><span class="tag">${esc(a.status||'Agendado')}</span></div><div>${esc(a.client)} • ${esc(a.service)}</div></div>`).join(''),()=>newAppointment());
if(r==='financeiro')return `<div class="hero"><h1>Financeiro</h1><p>Visão simples de faturamento e serviços.</p></div>${nav(tabs,r)}<div class="grid"><div class="card stat"><span class="muted">Receita registrada</span><b>${money(db.orders.reduce((a,o)=>a+Number(o.total||0),0))}</b></div><div class="card stat"><span class="muted">Ticket médio</span><b>${money(db.orders.length?db.orders.reduce((a,o)=>a+Number(o.total||0),0)/db.orders.length:0)}</b></div></div><div class="section card"><h3>Backup</h3><button class="btn" onclick="backup()">Exportar dados</button> <button class="btn ghost" onclick="restorePrompt()">Importar backup</button></div>`;
if(r==='plano')return `<div class="hero"><h1>Plano ${db.plans==='premium'?'Premium':'Gratuito'}</h1><p>Escolha recursos para crescer.</p></div>${nav(tabs,r)}<div class="grid"><div class="card"><h2>Grátis</h2><p>Clientes, veículos e serviços básicos.</p><div class="price">R$ 0</div><button class="btn ghost">Plano atual</button></div><div class="card"><h2>Premium</h2><p>Recursos avançados, destaque e relatórios.</p><div class="price">R$ 29,90<span class="small">/mês</span></div><button class="btn" onclick="subscribe()">Ativar demonstração</button></div></div>`;
return `<div class="hero"><h1>Configurações</h1><p>Perfil e dados da oficina.</p></div>${nav(tabs,r)}<div class="card"><h3>${esc(db.user?.name)}</h3><button class="btn danger" onclick="logout()">Sair</button></div>`}
function page(tabs,r,title,list,add){return `<div class="hero"><h1>${title}</h1><p>Gerencie informações da sua oficina.</p></div>${nav(tabs,r)}<div class="section actions"><button class="btn" onclick="(${add.toString()})()">+ Adicionar</button></div><div class="list">${list||'<div class="card muted">Nenhum registro ainda.</div>'}</div>`}
function renderClient(r){let tabs=[['home','🏠 Início'],['oficinas','📍 Oficinas'],['orcamentos','🧾 Orçamentos'],['agenda','📅 Agenda'],['veiculo','🚗 Meu carro'],['perfil','👤 Perfil']];if(r==='home')return `<div class="hero" style="background:linear-gradient(120deg,#2a1305,#b84e0b)"><h1>Mecânico Perto</h1><p>Encontre oficinas, peça orçamento e cuide do seu carro.</p></div>${nav(tabs,r)}<div class="grid"><div class="card"><h3>📍 Oficinas próximas</h3><p class="muted">Use sua localização para encontrar serviços.</p><button class="btn orange" onclick="route('oficinas')">Encontrar oficinas</button></div><div class="card"><h3>🧾 Pedir orçamento</h3><p class="muted">Envie o problema do carro para uma oficina.</p><button class="btn" onclick="newClientQuote()">Solicitar</button></div><div class="card"><h3>⏰ Manutenção</h3><p class="muted">Cadastre seu veículo e acompanhe revisões.</p><button class="btn secondary" onclick="route('veiculo')">Meu veículo</button></div></div>`;
if(r==='oficinas')return `<div class="hero" style="background:linear-gradient(120deg,#2a1305,#b84e0b)"><h1>Oficinas próximas</h1><p>Compare serviços, avaliação e contato.</p></div>${nav(tabs,r)}<div class="map"><div class="pin" style="left:35%;top:35%"><span>🔧</span></div><div class="pin" style="left:65%;top:58%"><span>🔧</span></div></div><div class="section list">${db.shops.map(s=>`<div class="card"><div class="row"><div><h3>${esc(s.name)}</h3><div class="muted">${esc(s.city)}</div><div class="stars">★★★★★ <span class="muted">${s.rating}</span></div></div><span class="tag ok">Aberta</span></div><p>${s.services.map(x=>`<span class="tag">${esc(x)}</span> `).join('')}</p><div class="actions"><button class="btn orange" onclick="newClientQuote('${s.id}')">Pedir orçamento</button><button class="btn ghost" onclick="sendWA('${s.phone}','Olá! Encontrei sua oficina no Mecânico Perto e gostaria de um orçamento.')">WhatsApp</button><button class="btn ghost" onclick="routeMap('${s.lat}','${s.lng}')">Como chegar</button></div></div>`).join('')}</div>`;
if(r==='orcamentos')return `<div class="hero"><h1>Meus orçamentos</h1><p>Acompanhe solicitações.</p></div>${nav(tabs,r)}<div class="list">${db.quotes.map(q=>`<div class="card row"><div><b>${esc(q.title)}</b><div class="muted">${esc(q.vehicle)}</div></div><span class="tag">${q.status}</span></div>`).join('')||'<div class="card muted">Você ainda não solicitou orçamentos.</div>'}</div>`;
if(r==='agenda')return `<div class="hero"><h1>Meus agendamentos</h1></div>${nav(tabs,r)}<div class="list">${db.appointments.map(a=>`<div class="card"><b>${esc(a.date)} ${esc(a.time)}</b><div>${esc(a.service)}</div><span class="tag">${esc(a.status||'Agendado')}</span></div>`).join('')||'<div class="card muted">Nenhum agendamento.</div>'}</div>`;
if(r==='veiculo')return `<div class="hero"><h1>Meu veículo</h1><p>Histórico e lembretes de manutenção.</p></div>${nav(tabs,r)}<div class="list">${db.vehicles.map(v=>`<div class="card"><h3>${esc(v.brand)} ${esc(v.model)}</h3><div class="muted">${esc(v.plate)} • ${esc(v.year)} • ${esc(v.km)} km</div><hr><b>Próxima revisão</b><p>Agende sua manutenção para manter o histórico atualizado.</p><button class="btn orange" onclick="newAppointment()">Agendar</button></div>`).join('')||'<div class="card muted">Cadastre seu carro para começar.</div>'}</div>`;
return `<div class="hero"><h1>Meu perfil</h1><p>Conta e preferências.</p></div>${nav(tabs,r)}<div class="card"><h3>${esc(db.user?.name||'Cliente Demo')}</h3><button class="btn danger" onclick="logout()">Sair</button></div>`}
function formModal(title,fields,onSubmit){openModal(`<h2>${title}</h2><div class="form">${fields.map(f=>`<div class="${f.full?'full':''}"><label>${f.label}</label>${f.type==='select'?`<select id="f_${f.id}">${f.opts.map(o=>`<option>${o}</option>`).join('')}</select>`:`<input id="f_${f.id}" type="${f.type||'text'}" placeholder="${f.ph||''}">`}</div>`).join('')}</div><div class="actions" style="margin-top:15px"><button class="btn" onclick="${onSubmit}">Salvar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function val(id){return document.getElementById('f_'+id)?.value||''}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function newCustomer(){formModal('Novo cliente',[{id:'name',label:'Nome',ph:'João da Silva'},{id:'phone',label:'WhatsApp',ph:'47999999999'},{id:'email',label:'E-mail'},{id:'notes',label:'Observações',full:true}],"saveCustomer()")}function saveCustomer(){db.customers.push({id:id(),name:val('name'),phone:val('phone'),email:val('email'),notes:val('notes')});save();closeModal();render('clientes');toast('Cliente cadastrado')}
function newVehicle(cid){formModal('Novo veículo',[{id:'plate',label:'Placa'},{id:'brand',label:'Marca'},{id:'model',label:'Modelo'},{id:'year',label:'Ano',type:'number'},{id:'km',label:'Quilometragem',type:'number'},{id:'customer',label:'Cliente',type:'select',opts:db.customers.map(c=>c.id+'|'+c.name)}],`saveVehicle('${cid||''}')`)}function saveVehicle(cid){let customer=cid||val('customer').split('|')[0];db.vehicles.push({id:id(),customerId:customer,plate:val('plate').toUpperCase(),brand:val('brand'),model:val('model'),year:val('year'),km:val('km')});save();closeModal();render('veiculos');toast('Veículo cadastrado')}
function newQuote(vid){let v=db.vehicles.find(x=>x.id===vid);formModal('Novo orçamento',[{id:'title',label:'Serviço',ph:'Troca de óleo e filtros'},{id:'vehicle',label:'Veículo',ph:v?`${v.plate} ${v.brand} ${v.model}`:'Veículo'},{id:'total',label:'Valor',type:'number'},{id:'phone',label:'WhatsApp do cliente'},{id:'date',label:'Data',type:'date'}],"saveQuote()")}function saveQuote(){db.quotes.push({id:id(),title:val('title'),vehicle:val('vehicle'),total:Number(val('total')),phone:val('phone'),date:val('date')||new Date().toISOString(),status:'Pendente'});save();closeModal();render('orcamentos');toast('Orçamento criado')}
function approveQuote(qid){let q=db.quotes.find(x=>x.id===qid);if(q){q.status='Aprovado';db.orders.push({id:id(),title:q.title,vehicle:q.vehicle,total:q.total,status:'Agendado'});save();render('orcamentos');toast('Orçamento aprovado e convertido em serviço')}}
function newOrder(){formModal('Nova ordem de serviço',[{id:'title',label:'Serviço'},{id:'vehicle',label:'Veículo'},{id:'total',label:'Valor',type:'number'}],"saveOrder()")}function saveOrder(){db.orders.push({id:id(),title:val('title'),vehicle:val('vehicle'),total:Number(val('total')),status:'Em andamento'});save();closeModal();render('ordens');toast('Serviço registrado')}
function newAppointment(){formModal('Agendar serviço',[{id:'date',label:'Data',type:'date'},{id:'time',label:'Horário',type:'time'},{id:'client',label:'Cliente'},{id:'service',label:'Serviço'}],"saveAppointment()")}function saveAppointment(){db.appointments.push({id:id(),date:val('date'),time:val('time'),client:val('client'),service:val('service'),status:'Agendado'});save();closeModal();render('agenda');toast('Agendamento salvo')}
function newClientQuote(shopId){formModal('Solicitar orçamento',[{id:'service',label:'O que seu carro precisa?',ph:'Ex.: freio fazendo barulho',full:true},{id:'vehicle',label:'Carro',ph:'Ex.: Onix 2020'},{id:'phone',label:'WhatsApp'},{id:'shop',label:'Oficina',type:'select',opts:db.shops.map(s=>s.id+'|'+s.name)}],"saveClientQuote()")}function saveClientQuote(){db.quotes.push({id:id(),title:val('service'),vehicle:val('vehicle'),phone:val('phone'),total:0,date:new Date().toISOString(),status:'Solicitado',shopId:val('shop')});save();closeModal();render('orcamentos');toast('Solicitação enviada')}
function sendWA(phone,msg){if(!phone){toast('Cadastre um WhatsApp primeiro');return}window.open('https://wa.me/'+String(phone).replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank')}
function routeMap(lat,lng){window.open('https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng,'_blank')}
function subscribe(){db.plans='premium';save();render('plano');toast('Premium ativado para demonstração')}
function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='oficina-facil-backup.json';a.click()}function restorePrompt(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render();toast('Backup restaurado')}catch(e){toast('Arquivo inválido')}};r.readAsText(i.files[0])};i.click()}
render();
</script></body></html>

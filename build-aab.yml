name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app with Android
        run: npx cap sync android

      - name: Build Android AAB
        working-directory: android
        run: ./gradlew bundleDebug --no-daemon

      - name: Verify AAB
        run: test -s android/app/build/outputs/bundle/debug/app-debug.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: oficina-facil-aab
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
